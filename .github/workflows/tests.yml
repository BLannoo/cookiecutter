name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

env:
  COLUMNS: 150
  UV_FROZEN: true
  FORCE_COLOR: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Define shared bootstrap once (never runs; used for anchors).
  _shared:
    if: ${{ false }}
    name: skipped
    runs-on: ubuntu-latest
    steps:
      - &checkout { uses: actions/checkout@v5 }
      - &setup_uv
        name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - &install_just
        name: Install just
        uses: taiki-e/install-action@just

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - *setup_uv
      - *install_just
      - name: Lint check (ruff)
        run: just lint-check

  test:
    name: Test • Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - *setup_uv
      - name: Run tests
        run: uv run --python=3.12 --isolated --group test -- pytest